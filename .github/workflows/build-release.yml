name: Build Release (APK + IPA + IPK)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vd: v1.0.1)'
        required: true
      version_name:
        description: 'Version (vd: 1.0.1 hoặc v1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  build-apk-mobile:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Validate & clean version
        run: |
          v="${{ inputs.version_name }}"
          v="${v#v}"; v="${v#V}"
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: version phải có dạng số (vd: 1.0.1 hoặc v1.0.1)"
            exit 1
          fi
          echo "CLEAN_VERSION=$v" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Update version
        run: |
          sed -i "s/^version:.*/version: $CLEAN_VERSION+1/" pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (mobile)
        run: flutter build apk --flavor mobile --release

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-mobile-release.apk \
             "nolelamphim-$CLEAN_VERSION.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-mobile
          path: nolelamphim-*.apk
          retention-days: 1

  build-apk-androidtv:
    name: Build Android TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Validate & clean version
        run: |
          v="${{ inputs.version_name }}"
          v="${v#v}"; v="${v#V}"
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: version phải có dạng số (vd: 1.0.1 hoặc v1.0.1)"
            exit 1
          fi
          echo "CLEAN_VERSION=$v" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Update version
        run: |
          sed -i "s/^version:.*/version: $CLEAN_VERSION+1/" pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (androidTv)
        run: flutter build apk --flavor androidTv --release

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-androidtv-release.apk \
             "nolelamphim-$CLEAN_VERSION-androidtv.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-androidtv
          path: nolelamphim-*-androidtv.apk
          retention-days: 1

  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Validate & clean version
        run: |
          v="${{ inputs.version_name }}"
          v="${v#v}"; v="${v#V}"
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: version phải có dạng số (vd: 1.0.1 hoặc v1.0.1)"
            exit 1
          fi
          echo "CLEAN_VERSION=$v" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Update version
        run: |
          sed -i '' "s/^version:.*/version: $CLEAN_VERSION+1/" pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Update iOS Deployment Target
        run: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/ios -name "*.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app file not found!"
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -qr "nolelamphim-$CLEAN_VERSION-unsigned.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: nolelamphim-*.ipa
          retention-days: 1

  build-webos:
    name: Build webOS IPK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install webOS TV CLI
        run: |
          npm install -g @webos-tools/cli 2>/dev/null || echo "CLI not available, skipping"

      - name: Package webOS app
        run: |
          if command -v ares-package &> /dev/null; then
            cd webos
            ares-package ./
            mv ./*.ipk ../nolelamphim-webos.ipk 2>/dev/null || true
            echo "webOS IPK built successfully"
          else
            echo "ares-package not found — build IPK thủ công bằng webOS TV SDK"
            echo "Hướng dẫn: cd webos && ares-package ./"
          fi

      - name: Upload webOS IPK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: webos
          path: nolelamphim-*.ipk
          retention-days: 1
          if-no-files-found: ignore

  create-release:
    name: Create Release
    needs: [build-apk-mobile, build-apk-androidtv, build-ipa, build-webos]
    runs-on: ubuntu-latest

    steps:
      - name: Clean version
        id: clean
        run: |
          v="${{ inputs.version_name }}"
          v="${v#v}"; v="${v#V}"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List downloaded files
        run: ls -R

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          body: |
            ## Nô Lệ Làm Phim ${{ inputs.version_name }}

            ### Downloads
            - **Android**: `nolelamphim-${{ steps.clean.outputs.version }}.apk`
            - **Android TV**: `nolelamphim-${{ steps.clean.outputs.version }}-androidtv.apk`
            - **iOS**: `nolelamphim-${{ steps.clean.outputs.version }}-unsigned.ipa` (unsigned, cần sign trước khi cài)
            - **LG webOS**: `nolelamphim-webos.ipk` (cài bằng webOS TV SDK)
          files: |
            apk-mobile/nolelamphim-*.apk
            apk-androidtv/nolelamphim-*.apk
            ipa/nolelamphim-*.ipa
            webos/nolelamphim-*.ipk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
