<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Nô Lệ Làm Phim</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0A0A1A;
      overflow: hidden;
      font-family: -apple-system, 'Noto Sans', sans-serif;
    }
    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }
    .loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0A0A1A;
      z-index: 10;
      transition: opacity 0.5s ease;
    }
    .loading.hidden { opacity: 0; pointer-events: none; }
    .loading .logo {
      width: 64px; height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #FF6B9D, #C44BED, #4A9EFF);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 28px; font-weight: bold;
      margin-bottom: 20px;
    }
    .loading .spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #C44BED;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="logo">N</div>
    <div class="spinner"></div>
  </div>

  <iframe id="appFrame"
    src="https://nolelamphim.vercel.app"
    allowfullscreen
    onload="onFrameLoad()">
  </iframe>

  <script>
    function onFrameLoad() {
      document.getElementById('loading').classList.add('hidden');
    }

    // webOS TV remote control → forward key events to iframe
    document.addEventListener('keydown', function(e) {
      const frame = document.getElementById('appFrame');
      if (!frame || !frame.contentWindow) return;
      frame.contentWindow.postMessage({
        type: 'webos-keydown',
        keyCode: e.keyCode,
        key: e.key
      }, '*');
    });

    // Detect webOS platform
    if (window.webOS && window.webOS.platform) {
      console.log('Running on webOS TV');
    }
  </script>
</body>
</html>
